# Project configuration — single source for periods, grid, thresholds, seeds and paths.
# Values follow docs/ROADMAP.md (§3.1, §3.4, §4.2–§4.5). Change them here, never in code,
# and log non-obvious changes in docs/DECISIONS.md.

project:
  name: desertification-s2
  seed: 482

# Time design (ROADMAP §4.2). ISO dates, inclusive.
periods:
  study: {start: "2019-01-01", end: "2025-12-31"}
  early: {start: "2019-01-01", end: "2021-12-31"}   # model features (RQ2)
  gap:   {start: "2022-01-01", end: "2022-12-31"}   # buffer between feature and label windows
  late:  {start: "2023-01-01", end: "2025-12-31"}   # predictive target (RQ2)

# Spatial units (ROADMAP §4.3).
grid:
  pixel_resolution_m: 20
  cell_size_m: 100

# Sentinel-2 L2A (ROADMAP §3.1).
sentinel2:
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  invalid_scl: [0, 1, 2, 3, 8, 9, 10, 11]
  max_request_px: 2500

# Sentinel Hub on the Copernicus Data Space Ecosystem (ROADMAP §3.1). Credentials come from
# SH_CLIENT_ID / SH_CLIENT_SECRET in .env, never from this file.
sentinel_hub:
  base_url: https://sh.dataspace.copernicus.eu
  token_url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
  collection_name: s2l2a_cdse

# P0-T03 connectivity check: one small test area for one month. This is a placeholder near the
# Ferlo (Senegal) candidate AOI, not a study AOI; real AOIs are fixed in M1-T02.
connectivity_check:
  name: ferlo_test
  bbox_wgs84: [-14.55, 15.45, -14.45, 15.55]   # [lon_min, lat_min, lon_max, lat_max], ~11 x 11 km
  time: {start: "2023-01-01", end: "2023-01-31"}   # dry season, so mostly clear skies

# CDSE quota and budget caps in processing units (ROADMAP §3.4).
quota:
  pu_total: 30000
  requests_total: 30000
  pu_caps:
    setup_pilot: 1000
    extraction: 20000
    auxiliary_eda: 2000
    reserve: 7000
  ask_before_requests: 10

# Labelling defaults (ROADMAP §4.5). Tuned once on training data, then frozen.
labels:
  version: v0-unset
  alpha: 0.05
  fdr_method: fdr_bh

# Paths relative to the repository root.
paths:
  config_dir: config
  aois: config/aois.geojson
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_sample: data/sample
  data_labels: data/labels
  api_usage_log: data/api_usage_log.csv
  catalog_cache: data/raw/catalog
  figures: reports/figures
  results: reports/results
  evalscripts: src/desertification/evalscripts
