# Project configuration — single source for periods, grid, thresholds, seeds and paths.
# Values follow docs/ROADMAP.md (§3.1, §3.4, §4.2–§4.5). Change them here, never in code,
# and log non-obvious changes in docs/DECISIONS.md.

project:
  name: desertification-s2
  seed: 482

# Time design (ROADMAP §4.2). ISO dates, inclusive.
periods:
  study: {start: "2019-01-01", end: "2025-12-31"}
  early: {start: "2019-01-01", end: "2021-12-31"}   # model features (RQ2)
  gap:   {start: "2022-01-01", end: "2022-12-31"}   # buffer between feature and label windows
  late:  {start: "2023-01-01", end: "2025-12-31"}   # predictive target (RQ2)

# Spatial units (ROADMAP §4.3).
grid:
  pixel_resolution_m: 20
  cell_size_m: 100

# Sentinel-2 L2A (ROADMAP §3.1).
sentinel2:
  bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  invalid_scl: [0, 1, 2, 3, 8, 9, 10, 11]
  max_request_px: 2500

# Sentinel Hub on the Copernicus Data Space Ecosystem (ROADMAP §3.1). Credentials come from
# SH_CLIENT_ID / SH_CLIENT_SECRET in .env, never from this file.
sentinel_hub:
  base_url: https://sh.dataspace.copernicus.eu
  token_url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
  collection_name: s2l2a_cdse

# P0-T03 connectivity check: one small test area for one month. This is a placeholder near the
# Ferlo (Senegal) candidate AOI, not a study AOI; real AOIs are fixed in M1-T02.
connectivity_check:
  name: ferlo_test
  bbox_wgs84: [-14.55, 15.45, -14.45, 15.55]   # [lon_min, lat_min, lon_max, lat_max], ~11 x 11 km
  time: {start: "2023-01-01", end: "2023-01-31"}   # dry season, so mostly clear skies

# AOI selection (M1-T02, ROADMAP §4.1). Candidates live in config/aoi_candidates.yaml.
aoi_selection:
  box_size_m: 20000            # side of the square AOI in its UTM zone
  snap_m: 100                  # AOI bounds are multiples of this (= grid.cell_size_m) so cells align
  dryland_ai_range: [0.05, 0.65]   # UNCCD Art. 1: P/PET between 0.05 and 0.65 = arid, semi-arid, dry sub-humid
  climatology_years: [1991, 2020]  # rainfall/ETo normals for aridity and seasons
  season_length_months: 4      # wet = wettest 4 consecutive months; dry = driest 4 consecutive months
  usable_cloud_pct: 40         # an acquisition date is "usable" if a scene covering the AOI has tile cloud cover <= this
  min_usable_dates_per_year: 20
  true_color_resolution_m: 60  # visual check only; ~0.4 PU per image for a 20 km AOI
  map_years: [2019, 2025]      # years averaged for the rainfall backdrop of the AOI map

# Open climate data on the Climate Hazards Center server (no account, no quota).
climate_data:
  chirps_monthly_url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/monthly/global/cogs/chirps-v3.0.{year}.{month:02d}.cog
  eto_monthly_url: https://data.chc.ucsb.edu/products/Hobbins_RefET/ETos_p05_monthly_global/tifs/ETos_p05.{year}.{month:02d}.tiff
  nodata_below: 0              # both products use -9999 over the ocean
  max_workers: 2               # parallel file reads; the CHC server answers HTTP 429 when pushed harder
  retry_rounds: 3              # extra passes over files that failed
  retry_backoff_s: 20          # pause before retry round r is retry_backoff_s * 2**r seconds

# CDSE quota and budget caps in processing units (ROADMAP §3.4).
quota:
  pu_total: 30000
  requests_total: 30000
  pu_caps:
    setup_pilot: 1000
    extraction: 20000
    auxiliary_eda: 2000
    reserve: 7000
  ask_before_requests: 10

# Labelling defaults (ROADMAP §4.5). Tuned once on training data, then frozen.
labels:
  version: v0-unset
  alpha: 0.05
  fdr_method: fdr_bh

# Paths relative to the repository root.
paths:
  config_dir: config
  aois: config/aois.geojson
  data_raw: data/raw
  data_interim: data/interim
  data_archive: data-cache.zip      # local cache archive (gitignored; scripts/pack_data.py)
  data_processed: data/processed
  data_sample: data/sample
  data_labels: data/labels
  api_usage_log: data/api_usage_log.csv
  catalog_cache: data/raw/catalog
  aoi_candidates: config/aoi_candidates.yaml
  aux_cache: data/raw/aux
  true_color_cache: data/raw/true_color
  figures: reports/figures
  results: reports/results
  evalscripts: src/desertification/evalscripts

# Moving the local cache between machines (scripts/pack_data.py, scripts/unpack_data.py).
data_cache:
  dirs: [data/raw, data/interim]
